name = "mdshare"
main = ".open-next/worker.js"
compatibility_date = "2026-03-11"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "mdshare-d1"
database_id = "replace-with-your-d1-database-id"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# For MPP config examples, see:
# - wrangler.mpp.example.toml
# Secrets should be set via:
# - pnpm exec wrangler secret put MPP_SECRET_KEY
# - pnpm exec wrangler secret put MPP_RECIPIENT
